<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico del video · Silvano</title>
<style>
  body { font: 15px/1.6 ui-monospace, Consolas, monospace; background:#14100E; color:#F8F4EE;
         margin:0; padding:24px; }
  h1 { font-size:18px; margin:0 0 4px; }
  p.sub { color:#9a918c; margin:0 0 20px; }
  table { border-collapse:collapse; width:100%; max-width:900px; margin-bottom:24px; }
  td { padding:7px 10px; border-bottom:1px solid #2e2724; vertical-align:top; }
  td:first-child { color:#9a918c; width:250px; }
  .ok   { color:#7CCB8E; }
  .bad  { color:#FF7A6B; font-weight:600; }
  .warn { color:#E9C46A; }
  video { width:min(300px,60vw); border:1px solid #2e2724; background:#000; display:block; margin-bottom:16px; }
  #log { max-width:900px; background:#1c1614; border:1px solid #2e2724; padding:12px; white-space:pre-wrap; }
  .verdict { max-width:900px; padding:14px 16px; border-radius:8px; margin-bottom:24px; font-size:15px; }
  .verdict.bad { background:rgba(255,122,107,.12); border:1px solid #FF7A6B; }
  .verdict.ok  { background:rgba(124,203,142,.12); border:1px solid #7CCB8E; color:#F8F4EE; }
</style>
</head>
<body>
<h1>Diagnóstico del video del hero</h1>
<p class="sub">Esta página no es parte del sitio. Sacala antes de publicar (o dejala: <code>.vercelignore</code> no la incluye, así que borrala a mano).</p>

<div id="verdict" class="verdict warn">Midiendo…</div>

<video id="v" muted loop playsinline preload="auto" controls
       poster="assets/img/hero-poster.jpg">
  <source src="assets/video/video-silvano.mp4" type="video/mp4">
</video>

<table id="t"></table>
<div id="log">Eventos del video:
</div>

<script>
const t = document.getElementById('t');
const logEl = document.getElementById('log');
const v = document.getElementById('v');
const verdict = document.getElementById('verdict');

function row(k, val, cls) {
  const tr = document.createElement('tr');
  const a = document.createElement('td'); a.textContent = k;
  const b = document.createElement('td'); b.textContent = val;
  if (cls) b.className = cls;
  tr.append(a, b); t.appendChild(tr);
}
function log(m) { logEl.textContent += '\n' + m; }

// --- 1. La causa más probable: el sistema pide menos movimiento -------------
const rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
row('prefers-reduced-motion', rm ? 'ACTIVADO' : 'desactivado', rm ? 'bad' : 'ok');

// --- 2. Cómo se abrió esta página -------------------------------------------
// (esta página no carga GSAP: no tiene sentido chequearlo acá)
const esFile = location.protocol === 'file:';
row('protocolo', location.protocol + (esFile ? '  <-- abrila por http://127.0.0.1:3000' : ''),
    esFile ? 'bad' : 'ok');
const esElectron = /Electron/i.test(navigator.userAgent);
row('navegador embebido', esElectron ? 'SÍ (visor de VS Code) — probá en Chrome o Edge' : 'no',
    esElectron ? 'bad' : 'ok');

// --- 3. El archivo llega? ---------------------------------------------------
fetch('assets/video/video-silvano.mp4', { method: 'HEAD' })
  .then(r => row('HEAD del .mp4', r.status + ' ' + (r.headers.get('content-type') || ''),
                 r.ok ? 'ok' : 'bad'))
  .catch(e => row('HEAD del .mp4', 'FALLÓ: ' + e.message, 'bad'));

// --- 4. Soporte de codec ----------------------------------------------------
row('canPlayType H.264', v.canPlayType('video/mp4; codecs="avc1.42E01E"') || 'NO SOPORTADO',
    v.canPlayType('video/mp4; codecs="avc1.42E01E"') ? 'ok' : 'bad');

// --- 5. Eventos del elemento ------------------------------------------------
['loadstart','loadedmetadata','loadeddata','canplay','playing','pause','stalled','suspend','error','abort']
  .forEach(ev => v.addEventListener(ev, () => {
    log(ev + '  (readyState=' + v.readyState + ', networkState=' + v.networkState + ')');
  }));

v.addEventListener('loadedmetadata', () => {
  row('medidas reales', v.videoWidth + ' x ' + v.videoHeight +
      (v.videoHeight > v.videoWidth ? '  (VERTICAL)' : '  (horizontal)'),
      v.videoHeight > v.videoWidth ? 'warn' : 'ok');
  row('duración', v.duration.toFixed(1) + ' s');
});

v.addEventListener('error', () => {
  const codes = {1:'ABORTED', 2:'NETWORK', 3:'DECODE', 4:'SRC_NOT_SUPPORTED'};
  const e = v.error;
  row('error del elemento', e ? (codes[e.code] || e.code) + ' — ' + (e.message || 'sin detalle') : '?', 'bad');
});

// --- 6. El navegador deja reproducir solo? ---------------------------------
v.play().then(() => {
  row('autoplay muteado', 'FUNCIONA', 'ok');
  verdict.className = 'verdict ok';
  verdict.textContent = rm
    ? 'El video reproduce acá, PERO tenés "prefers-reduced-motion" activado, y el sitio lo desactiva a propósito en ese caso. Esa es la razón por la que no lo ves en la página.'
    : 'El video reproduce bien acá. Si en la página no se ve, el problema está en el HTML o en main.js, no en el archivo ni en el navegador.';
}).catch(err => {
  row('autoplay muteado', 'BLOQUEADO — ' + err.name + ': ' + err.message, 'bad');
  verdict.className = 'verdict bad';
  verdict.textContent = 'El navegador bloqueó la reproducción automática. Dale play con el control de abajo: si así anda, es política de autoplay.';
});

// --- 7. Contexto ------------------------------------------------------------
row('viewport', innerWidth + ' x ' + innerHeight);
row('navegador', navigator.userAgent);
</script>
</body>
</html>
